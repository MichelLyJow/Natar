<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Natar</title>
<style>
:root{--bg:#f4f4f5;--fg:#111;--mut:#6b6b70;--card:rgba(0,0,0,.05);--bd:rgba(0,0,0,.14);--ok:#12a150;--bad:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f5f5f5;--mut:#8a8a8a;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.15);--ok:#3ddc84;--bad:#ff5c5c}}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5f5;--mut:#8a8a8a;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.15);--ok:#3ddc84;--bad:#ff5c5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;margin:8px 0 4px;letter-spacing:-.5px}
p.s{color:var(--mut);margin:0 0 18px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;backdrop-filter:blur(14px)}
input{width:100%;background:transparent;color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:16px;margin-bottom:10px;outline:none}
input:focus{border-color:var(--fg)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 16px;font-weight:600}
button.g{background:transparent;color:var(--fg)}
button.w{width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mut{color:var(--mut);font-size:13px}
.item{cursor:pointer}
.bar{height:6px;border-radius:6px;background:var(--bd);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.d{padding:12px 0;text-align:center;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-weight:600}
.d.p{background:var(--ok);color:#000;border-color:transparent}
.d.n{background:var(--bad);color:#000;border-color:transparent}
.d.l{opacity:.35}
.chk{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.chk input{width:20px;height:20px;margin:0;flex:none}
.big{font-size:44px;font-weight:800;text-align:center;margin:6px 0}
.v{text-align:center;font-weight:700;margin-bottom:12px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const QQ={id:["Tidak membuka konten dewasa","Ibadah tepat waktu","Olahraga / gerak badan","Tidur cukup (6+ jam)","Bangun pagi","Minum air cukup","Makan teratur","Belajar / ngoding / berkarya","Ngobrol dengan teman atau keluarga","Keluar kamar / rumah","Layar HP dibatasi","Tidak menyendiri lama di kamar","Bisa menahan godaan","Menulis jurnal / refleksi","Bersyukur hari ini"],
en:["No adult content","On-time prayer / worship","Exercise / physical activity","Enough sleep (6+ hrs)","Woke up early","Drank enough water","Ate regularly","Learned / coded / created","Talked with friends or family","Left the room / house","Limited screen time","Didn't isolate in my room","Resisted temptation","Wrote a journal / reflection","Felt grateful today"]};
const TT={id:{sub:"Catat streak, isi laporan harian, jaga konsisten.",p1:"Judul streak (contoh: Natar)",p2:"Berapa hari mau jaga diri?",mk:"Buat Streak",al:"Isi jumlah hari 1 - 365",cf:"Hapus streak ini beserta semua laporannya?",em:"Belum ada streak.",dl:"Hapus",day:"Hari",st:"Streak",pos:"positif",neg:"negatif",fin:"Selesai",bk:"← Kembali",rp:"Laporan",hint:"Centang yang berhasil kamu lakukan hari ini.",sv:"Simpan Laporan",vp:"POSITIF",vn:"NEGATIF",d:"hari"},
en:{sub:"Track your streak, fill in daily reports, stay consistent.",p1:"Streak title (e.g. Natar)",p2:"How many days will you hold on?",mk:"Create Streak",al:"Enter a number of days between 1 and 365",cf:"Delete this streak and all its reports?",em:"No streaks yet.",dl:"Delete",day:"Day",st:"Streak",pos:"positive",neg:"negative",fin:"Finished",bk:"← Back",rp:"Report",hint:"Check everything you accomplished today.",sv:"Save Report",vp:"POSITIVE",vn:"NEGATIVE",d:"days"}};
let L='en';try{L=localStorage.getItem('natar_l')||((navigator.language||'').startsWith('id')?'id':'en')}catch(e){}
const t=k=>TT[L][k],Q=new Array(15).fill(0);
const setL=l=>{L=l;try{localStorage.setItem('natar_l',l)}catch(e){}render()};
const lb=()=>`<div class="row" style="justify-content:flex-end;gap:6px;margin-bottom:6px"><button class="g" style="padding:6px 12px;${L==='id'?'':'opacity:.4'}" onclick="setL('id')">ID</button><button class="g" style="padding:6px 12px;${L==='en'?'':'opacity:.4'}" onclick="setL('en')">EN</button></div>`;
let S=[],cur=null,day=null,tmp=[];
try{S=JSON.parse(localStorage.getItem('natar')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('natar',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
const dayNow=s=>Math.floor((today()-s.start)/864e5)+1;
const pct=a=>Math.round(a.filter(Boolean).length/Q.length*100);
const sc=(s,d)=>s.r[d]?pct(s.r[d]):null;
const streak=s=>{let c=0;for(let d=1;d<=s.days;d++){const p=sc(s,d);if(p===null)continue;c=p>=60?c+1:0}return c};
const cnt=s=>{let p=0,n=0;for(let d=1;d<=s.days;d++){const v=sc(s,d);if(v===null)continue;v>=60?p++:n++}return{p,n}};

function add(){
  const ti=document.getElementById('t').value.trim()||'Natar';
  const n=parseInt(document.getElementById('n').value,10);
  if(!n||n<1||n>365){alert(t('al'));return}
  S.unshift({id:Date.now(),title:ti,days:n,start:today(),r:{}});
  save();render();
}
function del(id,e){
  e.stopPropagation();
  if(confirm(t('cf'))){S=S.filter(s=>s.id!==id);save();render()}
}
function open_(id){cur=S.find(s=>s.id===id);day=null;render()}
function openDay(d){
  if(d>dayNow(cur))return;
  day=d;tmp=cur.r[d]?cur.r[d].slice():Q.map(()=>false);render();
}
function tog(i){tmp[i]=!tmp[i];upd()}
function upd(){
  const p=pct(tmp),el=document.getElementById('pc'),v=document.getElementById('vd');
  el.textContent=p+'%';
  v.textContent=p>=60?t('vp'):t('vn');
  v.className='v '+(p>=60?'pos':'neg');
}
function saveDay(){cur.r[day]=tmp.slice();save();day=null;render()}
function back(){if(day!==null)day=null;else cur=null;render()}

function render(){
  const a=document.getElementById('app');document.documentElement.lang=L;
  if(!cur){
    a.innerHTML=lb()+`<h1>Natar</h1><p class="s">${t('sub')}</p>
    <div class="card"><input id="t" placeholder="${t('p1')}" maxlength="40">
    <input id="n" type="number" inputmode="numeric" placeholder="${t('p2')}" min="1" max="365">
    <button class="w" onclick="add()">${t('mk')}</button></div>`+
    (S.length?S.map(s=>{const c=cnt(s),now=Math.min(dayNow(s),s.days);return`<div class="card item" onclick="open_(${s.id})">
      <div class="row"><b>${esc(s.title)}</b><button class="g" onclick="del(${s.id},event)">${t('dl')}</button></div>
      <div class="mut">${t('day')} ${Math.max(now,1)} / ${s.days} · ${t('st')} ${streak(s)} · <span class="pos">+${c.p}</span> <span class="neg">-${c.n}</span></div>
      <div class="bar"><i style="width:${Math.min(100,Math.max(now,1)/s.days*100)}%"></i></div></div>`}).join(''):`<p class="mut" style="text-align:center">${t('em')}</p>`);
    return;
  }
  if(day===null){
    const c=cnt(cur),now=dayNow(cur);let g='';
    for(let d=1;d<=cur.days;d++){const v=sc(cur,d);const k=v===null?(d>now?'l':''):(v>=60?'p':'n');g+=`<button class="d ${k}" onclick="openDay(${d})">${d}</button>`}
    a.innerHTML=lb()+`<button class="g" onclick="back()">${t('bk')}</button>
    <h1>${esc(cur.title)}</h1>
    <p class="s">${t('st')} ${streak(cur)} ${t('d')} · <span class="pos">${c.p} ${t('pos')}</span> · <span class="neg">${c.n} ${t('neg')}</span>${now>cur.days?' · '+t('fin'):''}</p>
    <div class="grid">${g}</div>`;
    return;
  }
  a.innerHTML=lb()+`<button class="g" onclick="back()">${t('bk')}</button>
  <h1>${t('day')} ${day} · ${t('rp')}</h1><p class="s">${t('hint')}</p>
  <div class="card"><div class="big" id="pc"></div><div class="v" id="vd"></div></div>
  <div class="card">${QQ[L].map((q,i)=>`<label class="chk"><input type="checkbox" ${tmp[i]?'checked':''} onchange="tog(${i})"><span>${esc(q)}</span></label>`).join('')}</div>
  <button class="w" onclick="saveDay()">${t('sv')}</button>`;
  upd();
}
render();
</script>
</body>
</html>
